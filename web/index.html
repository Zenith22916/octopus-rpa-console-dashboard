<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>RPA 运行仪表盘</title>

<!-- ==================== 样式 ====================
     1. Element Plus 主题（组件库本体）
     2. Element Plus 深色变量（html.dark 下生效）
     3. app.css：EP 变量覆写 + 壳层布局 + 业务自定义块（甘特图/日历/机器人卡片/Monaco 装饰） -->
<link rel="stylesheet" href="/vendor/element-plus.css">
<link rel="stylesheet" href="/vendor/element-plus-dark.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app"></div>

<!-- ==================== 第三方库（本地自托管，完全离线，不走 CDN） ====================
     Vue 3 / Element Plus 用官方 UMD 产物，全局暴露 window.Vue / window.ElementPlus；
     业务代码是原生 ES Module（见下方 type="module"），通过 js/vendor.js 转成模块导入。

     加载顺序有两条硬约束：
     1) Vue 必须在 Element Plus、图标集之前（两者的 UMD 工厂都直接取全局 Vue）；
     2) Monaco 的 AMD loader 必须在 echarts / Element Plus 之后 —— 它定义了 define.amd，
        而 echarts 的 UMD 包装一旦检测到 define.amd 就会注册成 AMD 模块、
        不再暴露 window.echarts 全局。 -->
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/element-plus-icons.js"></script>
<script src="/vendor/element-plus-zh-cn.js"></script>
<script src="/echarts.min.js"></script>
<script src="/monaco/vs/loader.js"></script>

<script type="module" src="/js/main.js"></script>
</body>
</html>
